[workspace]
resolver = "2"
members = [
    "agent-react-bench",
    "bench-spawn-time",
    "bench-execution-latency",
    "speculative-decoding",
]

[workspace.dependencies]
inferlet = { path = "../../sdk/rust/inferlet" }
inferlet-macros = { path = "../../sdk/rust/inferlet-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"

[profile.release]
lto = true
