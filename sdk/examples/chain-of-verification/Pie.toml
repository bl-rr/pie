[package]
name = "chain-of-verification"
version = "0.1.0"
description = "Chain-of-Verification inferlet with paper-faithful factored verification and legacy search fallback"
authors = ["Pie Team"]

[runtime]
core = "^0.2.0"
mcp = "^0.2.0"

[parameters]
config = {type = "string", optional = true, description = "Path to the CoVe TOML config file"}
question = {type = "string", optional = true, description = "Run a single question instead of batch evaluation"}
verbose = {type = "bool", optional = true, description = "Print intermediate CoVe steps"}
debug_prompt = {type = "string", optional = true, description = "Run a raw exact-prompt debug generation instead of full CoVe"}
debug_stop_json = {type = "string", optional = true, description = "JSON array of stop strings for debug_prompt mode"}
debug_max_tokens = {type = "int", optional = true, description = "Maximum number of new tokens for debug_prompt mode"}
