[workspace]
resolver = "2"
members = [
    "agent-codeact",
    "agent-react",
    "agent-swarm",
    "attention-sink",
    "cacheback-decoding",
    "branch-drop-mask",
    "branch-drop-linear-prefill",
    "branch-from-beginning",
    "branch-isolated-prefill",
    "branch-mask",
    "chain-of-verification",
    "chain-of-verification-optimized",
    "constrained-decoding",
    "decode-vs-prefill-counting",
    "graph-of-thought",
    "helloworld",
    "http-server",
    "image-fetch",
    "jacobi-decoding",
    "kvs",
    "kv-mask-counting",
    "fork-from-instruction",
    "mask-from-forks",
    "mask-in-place",
    "masked-no-drop-repro",
    "output-validation",
    "parallel-generation",
    "position-gap-impact-counting",
    "position-id-restore-overhead",
    "prefix-caching",
    "prefix-tree",
    "recursion-of-thought",
    "separate-contexts",
    "selective-import-counting",
    "selective-import-linear-prefill",
    "selective-import-linear-masked-compose",
    "selective-import-linear-masked-compose-counting",
    "selective-import-masked-prefill",
    "selective-import-position-sensitivity",
    "skeleton-of-thought",
    "tree-of-thought",
    "watermarking",
    "windowed-attention",
    "roll-back",
]

[workspace.dependencies]
inferlet = { path = "../rust/inferlet" }
inferlet-macros = { path = "../rust/inferlet-macros" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
futures = "0.3.31"

[profile.release]
lto = true
